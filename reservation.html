  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub4_1 sub_reserve">
          <div class="sub_visual_wide" data-reservation-hero-bg>
            <div class="visual_box">
              <div class="visual_txt">
                <div data-aos="fade-up" data-aos-duration="1000">
                  <strong data-reservation-hero-title></strong>
                  <p data-reservation-hero-description></p>
                </div>
              </div>
            </div>
          </div>
          <!--// sub_visual_wide -->

          <!-- 원본 서브 탭 — 「예약하기」(실시간예약 새 창) / 「이용안내」(이 페이지) -->
          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <ul>
                <li><a href="#!" target="_blank" data-booking-link>예약하기</a></li>
                <li class="on"><a href="./reservation.html">이용안내</a></li>
              </ul>
            </div>
          </div>

          <!-- prettier-ignore -->
          <div class="sub_cont" style="background:url('images/common/main_about_bg.webp') repeat-y 50% 0;background-size:cover;">
            <!-- ⚠️ 원본은 `<dl class="info_box">` 안에 `dt`(제목) / `dd`(본문) 쌍을
                 **평면으로** 늘어놓는다. `dd + dt` 에 위 여백이 붙으므로
                 쌍을 `<div>` 로 감싸면 안 된다. 매퍼가 쌍 단위로 숨긴다. -->
            <dl class="info_box" data-aos="fade-up">
              <dt class="title_box" data-reservation-info-row>
                <h3 data-reservation-info-title></h3>
              </dt>
              <dd data-reservation-info-row data-reservation-info-text></dd>

              <dt class="title_box" data-reservation-refund-row>
                <h3>환불안내</h3>
              </dt>
              <dd data-reservation-refund-row data-reservation-refund-text></dd>
            </dl>
          </div>
          <!--// sub_cont -->
        </section>
